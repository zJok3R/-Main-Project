<!doctype html>
<html lang="de">
<head>
<meta charset="utf-8">
<style>
  html, body {
    margin: 0;
    width: 1200px;
    height: 630px;
    overflow: hidden;
    background: #010101;
    font-family: -apple-system, "Helvetica Neue", Arial, sans-serif;
    -webkit-font-smoothing: antialiased;
  }
  .stage {
    position: relative;
    width: 1200px;
    height: 630px;
    display: flex;
    align-items: center;
    padding-left: 90px;
    box-sizing: border-box;
  }
  .ring {
    width: 228px;
    height: 228px;
    flex: none;
  }
  .text {
    margin-left: 72px;
  }
  h1 {
    margin: 0;
    color: #ffffff;
    font-size: 110px;
    font-weight: 700;
    letter-spacing: -2px;
    line-height: 1;
  }
  p {
    margin: 18px 0 0;
    color: #a8a8a8;
    font-size: 30px;
    line-height: 1.35;
    max-width: 780px;
  }
  .domain {
    position: absolute;
    right: 48px;
    bottom: 36px;
    color: #a8a8a8;
    font-size: 24px;
  }
</style>
</head>
<body>
  <div class="stage">
    <svg class="ring" viewBox="0 0 228 228" xmlns="http://www.w3.org/2000/svg">
      <circle cx="114" cy="114" r="100" fill="none" stroke="#f2ad00" stroke-width="28"/>
    </svg>
    <div class="text">
      <h1>Omnaut</h1>
      <p>AI Agents, Workflows und Automatisierung für den Mittelstand — zum Festpreis, DSGVO-konform, produktiv statt Pilot.</p>
    </div>
  </div>
  <div class="domain">omnaut.de</div>
</body>
</html>
